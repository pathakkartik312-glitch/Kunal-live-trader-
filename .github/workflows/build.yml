name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Compose Compiler Configuration
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove old composeOptions block
          text = re.sub(
              r'\n\s*composeOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          # Remove old Compose compiler dependency lines
          text = re.sub(
              r'^\s*(implementation|kotlinCompilerPluginClasspath)\s*\(\s*["\']androidx\.compose\.compiler:[^"\']+["\']\s*\)\s*$',
              '',
              text,
              flags=re.M
          )

          # Remove duplicate Compose plugin declarations.
          lines = text.splitlines()
          result = []
          compose_found = False

          for line in lines:
              if 'org.jetbrains.kotlin.plugin.compose' in line:
                  if compose_found:
                      continue
                  compose_found = True
                  line = re.sub(
                      r'\s+version\s+["\'][^"\']+["\']',
                      '',
                      line
                  )
              result.append(line)

          text = '\n'.join(result) + '\n'
          p.write_text(text)

          print("Compose compiler configuration cleaned.")
          PY

          echo "===== COMPOSE CONFIGURATION ====="
          grep -n "org.jetbrains.kotlin.plugin.compose\|composeOptions\|compose.compiler" app/build.gradle.kts || true

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "===== GENERATED APK ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
