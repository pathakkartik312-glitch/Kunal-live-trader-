name: Build Kunal Live Trader - User + Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Compose Plugin
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove Compose plugin aliases/declarations
          text = re.sub(
              r'^[ \t]*(?:id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\'][^\n]*|alias\([^\n]*compose[^\n]*\))[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE | re.IGNORECASE
          )

          # Remove old Compose compiler options
          text = re.sub(
              r'\n[ \t]*composeOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          match = re.search(r'plugins\s*\{', text)

          if not match:
              raise SystemExit("ERROR: plugins block not found")

          insert_at = match.end()

          text = (
              text[:insert_at]
              + '\n    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10"'
              + text[insert_at:]
          )

          p.write_text(text)
          PY

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper --gradle-version 9.3.1

      - name: Prepare User and Admin Projects
        run: |
          rm -rf user-build admin-build

          cp -a extracted user-build
          cp -a extracted admin-build

          # USER APK package ID
          python3 - <<'PY'
          from pathlib import Path

          # User project
          p = Path("user-build/app/build.gradle.kts")
          text = p.read_text()
          text = text.replace(
              'applicationId = "com.example"',
              'applicationId = "com.kunal.livetrader.user"'
          )
          p.write_text(text)

          # Admin project
          p = Path("admin-build/app/build.gradle.kts")
          text = p.read_text()
          text = text.replace(
              'applicationId = "com.example"',
              'applicationId = "com.kunal.livetrader.admin"'
          )
          p.write_text(text)
          PY

          # Disable Admin navigation in USER APK
          python3 - <<'PY'
          from pathlib import Path

          p = Path("user-build/app/src/main/java/com/example/MainActivity.kt")
          text = p.read_text()

          old = 'onNavigateAdmin = { navController.navigate(NavRoutes.ADMIN_LOGIN) }'
          new = 'onNavigateAdmin = { }'

          if old not in text:
              raise SystemExit(
                  "Could not find Admin navigation line in MainActivity.kt"
              )

          text = text.replace(old, new)
          p.write_text(text)

          print("User APK: Admin navigation disabled")
          print("Admin APK: Admin navigation preserved")
          PY

      - name: Create User Debug Keystore
        working-directory: user-build
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Kunal Live Trader User,O=Kunal,C=IN"

      - name: Create Admin Debug Keystore
        working-directory: admin-build
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Kunal Live Trader Admin,O=Kunal,C=IN"

      - name: Build User APK
        working-directory: user-build
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Build Admin APK
        working-directory: admin-build
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Find Both APKs
        run: |
          echo "===== USER APK ====="
          find user-build -type f -name "*.apk" -print

          echo "===== ADMIN APK ====="
          find admin-build -type f -name "*.apk" -print

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-USER-APK
          path: user-build/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-ADMIN-APK
          path: admin-build/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
