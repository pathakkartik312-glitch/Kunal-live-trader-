name: Check Kunal Live Trader Configuration

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Show Project Configuration
        working-directory: extracted
        run: |
          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== ROOT BUILD ====="
          cat build.gradle.kts

          echo "===== APP BUILD ====="
          cat app/build.gradle.kts

          echo "===== VERSION CATALOG ====="
          if [ -f gradle/libs.versions.toml ]; then
            cat gradle/libs.versions.toml
          else
            echo "libs.versions.toml NOT FOUND"
          fi

          echo "===== GOOGLE SERVICES ====="
          find . -name "google-services.json" -print
