name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect Project
        working-directory: extracted
        run: |
          echo "===== APP BUILD FILE ====="
          sed -n '1,80p' app/build.gradle.kts

          echo "===== VERSION CATALOG ====="
          grep -nE 'kotlin|compose|agp' gradle/libs.versions.toml || true

      - name: Fix Duplicate Compose Plugin
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Find plugins block.
          m = re.search(r'plugins\s*\{(.*?)\}', text, re.S)

          if not m:
              raise SystemExit("plugins block not found")

          block = m.group(1)

          # Remove ALL Compose plugin declarations from the plugins block.
          block = re.sub(
              r'(?m)^[ \t]*id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\'][^\n]*\n?',
              '',
              block
          )

          # Add exactly ONE Compose plugin declaration.
          block = '\n    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10"\n' + block

          text = text[:m.start(1)] + block + text[m.end(1):]

          # Remove old composeOptions if present.
          text = re.sub(
              r'\n[ \t]*composeOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.S
          )

          p.write_text(text)

          print("===== FIXED PLUGINS BLOCK =====")
          print(re.search(r'plugins\s*\{.*?\}', text, re.S).group(0))
          PY

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper --gradle-version 8.14.3

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "===== APK ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
