name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Compose Plugin
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove every Compose plugin line.
          text = re.sub(
              r'^[ \t]*id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\'][^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # Add exactly ONE Compose plugin after plugins {
          text = text.replace(
              "plugins {",
              'plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10"',
              1
          )

          # Remove old composeOptions block.
          text = re.sub(
              r'\n[ \t]*composeOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          p.write_text(text)

          print("===== FINAL PLUGINS =====")
          for line in text.splitlines()[:20]:
              print(line)
          PY

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper --gradle-version 8.14.3

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-configuration-cache --stacktrace

      - name: Find APK
        if: success()
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
