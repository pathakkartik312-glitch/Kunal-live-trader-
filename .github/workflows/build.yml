name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
       - name: Fix Compose Compiler Configuration
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove old Compose compiler configuration if present.
          text = re.sub(
              r'\n\s*composeOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          # Remove old explicit Compose compiler plugin version declarations.
          text = re.sub(
              r'id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\']\)\s*version\s*["\'][^"\']+["\']',
              'id("org.jetbrains.kotlin.plugin.compose")',
              text
          )

          p.write_text(text)

          print("Compose compiler configuration cleaned.")
          PY

          echo "===== COMPOSE PLUGIN CONFIGURATION ====="
          grep -n "compose" app/build.gradle.kts || true
          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove old Compose compiler extension configuration.
          text = re.sub(
              r'\n\s*composeOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          # Remove old explicit Compose compiler dependency if present.
          text = re.sub(
              r'^\s*(implementation|kotlinCompilerPluginClasspath)\s*\(\s*["\']androidx\.compose\.compiler:[^"\']+["\']\s*\)\s*$',
              '',
              text,
              flags=re.M
          )

          # Add the modern Kotlin Compose compiler plugin.
          if 'org.jetbrains.kotlin.plugin.compose' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10"',
                  1
              )

          p.write_text(text)
          print("Compose compiler configuration updated.")
          PY

          echo "===== UPDATED APP BUILD ====="
          sed -n '1,100p' app/build.gradle.kts

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "Generated APK:"
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
