name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Kotlin Compose Configuration
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove ALL Compose compiler plugin declarations from app module.
          text = re.sub(
              r'^\s*id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\']\)(?:\s+version\s+["\'][^"\']+["\'])?\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove old composeOptions block.
          text = re.sub(
              r'\n\s*composeOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove old Compose compiler dependencies.
          text = re.sub(
              r'^\s*(?:implementation|kotlinCompilerPluginClasspath)\s*\(\s*["\']androidx\.compose\.compiler:[^"\']+["\']\s*\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Clean empty duplicate blank lines.
          text = re.sub(r'\n{3,}', '\n\n', text)

          p.write_text(text)

          print("===== FINAL APP BUILD FILE =====")
          print(text)
          PY

      - name: Verify Project
        working-directory: extracted
        run: |
          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== ROOT BUILD ====="
          cat build.gradle.kts

          echo "===== APP BUILD ====="
          cat app/build.gradle.kts

          echo "===== VERSION CATALOG ====="
          grep -nE 'kotlin|compose|ksp|agp' gradle/libs.versions.toml || true

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper --gradle-version 9.7.0

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-configuration-cache --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
