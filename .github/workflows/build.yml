name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -q kunal-trader-live-ready.zip -d extracted
          echo "=== EXTRACTED FILES ==="
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: '**/build/outputs/apk/debug/*.apk'
