      - name: Check Extracted Project
        run: |
          echo "=== ALL GRADLE FILES ==="
          find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
          \) -print

          echo "=== EXTRACTED FOLDERS ==="
          find extracted -maxdepth 3 -type d -print
