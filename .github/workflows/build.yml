name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK:"
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
