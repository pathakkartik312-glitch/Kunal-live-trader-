name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Kotlin and Compose Configuration
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Remove ALL Compose compiler plugin declarations.
          text = re.sub(
              r'^\s*id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\']\).*?$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove old Compose compiler options.
          text = re.sub(
              r'\n\s*composeOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          # Remove old Compose compiler dependencies.
          text = re.sub(
              r'^\s*(implementation|kotlinCompilerPluginClasspath)\s*\(\s*["\']androidx\.compose\.compiler[^)]*\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          p.write_text(text)

          # Add Compose plugin exactly once, matching Kotlin 2.2.10.
          text = p.read_text()

          if 'id("org.jetbrains.kotlin.plugin.compose")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10"',
                  1
              )

          p.write_text(text)

          print("===== FINAL APP BUILD FILE =====")
          print(p.read_text())
          PY

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper --gradle-version 8.14.3

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Compose Plugin
        working-directory: extracted
        run: |
          echo "===== COMPOSE REFERENCES ====="
          grep -Rni "compose.plugin\|composeOptions\|compose.compiler" \
            app/build.gradle.kts \
            build.gradle.kts \
            gradle/libs.versions.toml || true

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-configuration-cache --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "===== GENERATED APK ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
