name: Build Kunal Live Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q kunal-trader-live-ready.zip -d extracted

      - name: Show Project Structure
        working-directory: extracted
        run: |
          echo "===== PROJECT FILES ====="
          find . -type f | sort | head -1000

      - name: Check Admin Integration
        working-directory: extracted
        run: |
          echo "===== ADMIN REFERENCES ====="
          grep -RniE "AdminScreens|AdminViewModel|admin|ADMIN" \
            app/src/main/java/com/example \
            --include="*.kt" | head -300 || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Compose Plugin
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'^[ \t]*(?:id\(["\']org\.jetbrains\.kotlin\.plugin\.compose["\'][^\n]*|alias\([^\n]*compose[^\n]*\))[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE | re.IGNORECASE
          )

          text = re.sub(
              r'\n[ \t]*composeOptions\s*\{.*?\n[ \t]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          match = re.search(r'plugins\s*\{', text)

          if not match:
              raise SystemExit("ERROR: plugins block not found")

          insert_at = match.end()

          text = (
              text[:insert_at]
              + '\n    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10"'
              + text[insert_at:]
          )

          p.write_text(text)

          print("===== FINAL PLUGINS BLOCK =====")
          m = re.search(r'plugins\s*\{.*?\}', text, re.DOTALL)
          print(m.group(0) if m else "NOT FOUND")
          PY

      - name: Verify No Duplicate Compose Plugin
        working-directory: extracted
        run: |
          echo "===== COMPOSE REFERENCES ====="
          grep -RniE \
            'org\.jetbrains\.kotlin\.plugin\.compose|libs\.plugins\..*compose|composeOptions' \
            app/build.gradle.kts gradle/libs.versions.toml build.gradle.kts || true

      - name: Generate Gradle Wrapper
        working-directory: extracted
        run: |
          gradle wrapper --gradle-version 9.3.1

      - name: Create Debug Keystore
        working-directory: extracted
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        if: success()
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kunal-Live-Trader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
